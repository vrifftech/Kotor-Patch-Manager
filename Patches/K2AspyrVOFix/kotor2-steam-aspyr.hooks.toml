# KOTOR2 Steam/Aspyr Windows voice WAV fix
#
# Function: CExoStreamingSoundSourceInternal::InitializeSource equivalent
# Problem: In the _g_bModifiedSound-enabled type-4/WAV streaming branch,
#          the code accepts a file that starts with "RIFF" at offset 0, but
#          still subtracts 0x1D6 from the length and seeks to 0x1D6 before
#          calling AIL_open_stream(... .wav). That corrupts normal WAV files.
#
# Correct behavior, matching LegacyPC/Linux/macOS logic:
#   - RIFF at offset 0    -> length = full file length, seek offset = 0
#   - RIFF at offset 1D6  -> length = file length - 0x1D6, seek offset = 0x1D6
#
#
# Validated for Steam Aspyr:
#   SHA-256:    6A522E71631DCEE93467BD2010F3B23D9145326E1E2E89305F13AB104DBBFFEF
#   file offset: 0x0030C8CE
#   VA:          0x0070D4CE
#   original:    sub eax, 0x1D6
#   replacement: nop * 5, leaving EAX as full file length
[[hooks]]
address = 0x0070D4CE
type = "simple"
original_bytes = [0x2D, 0xD6, 0x01, 0x00, 0x00]
replacement_bytes = [0x90, 0x90, 0x90, 0x90, 0x90]

# Validated for Steam Aspyr:
